[project]
name = "twenty-barks"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
LOG_LEVEL = { description = "Server log level: debug, info, warn, or error", default = "info", required = false }
LITELLM_BASE_URL = { description = "ScottyLabs AI gateway; Jev is served under /typesafe", required = true }
LITELLM_API_KEY = { description = "Budgeted key for the AI gateway", required = true }
KEYCLOAK_URL = { description = "ScottyLabs Keycloak, for optional sign-in", required = false }
KEYCLOAK_REALM = { description = "Keycloak realm", required = false }
OIDC_CLIENT_ID = { description = "This app's Keycloak client", required = false }
OIDC_CLIENT_SECRET = { description = "This app's Keycloak client secret", required = false }
OAUTH_RELAY_URL = { description = "Shared OAuth relay, so preview hosts can sign in", required = false }
ADMIN_USERS = { description = "Comma-separated usernames or emails allowed into the admin pages", required = false }
POSTHOG_KEY = { description = "PostHog project key for counting page views; set only in prod", required = false }
POSTHOG_HOST = { description = "PostHog ingest host, if not the US cloud", required = false }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev]
