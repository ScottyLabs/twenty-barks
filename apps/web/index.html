<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bark is thinking of something at CMU. You get twenty yes-or-no questions."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Twenty Barks</title>
    <script>
      // Pick light or dark before the first paint, by the same rules as src/theme.ts.
      (function () {
        try {
          var account = localStorage.getItem("twenty-barks:account-theme");
          var flipped =
            account === null
              ? localStorage.getItem("twenty-barks:look")
              : sessionStorage.getItem("twenty-barks:visit-look");
          var look =
            flipped === "light" || flipped === "dark"
              ? flipped
              : account === "light" || account === "dark"
                ? account
                : matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          document.documentElement.dataset.theme = look;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
